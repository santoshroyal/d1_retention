# Recipients for the daily D1 retention email sent by `./tune schedule`.
#
# Two lists:
#   recipients          — used by default (intended for repeated testing / dev).
#   extended_recipients — used when `./tune schedule --prod` is passed
#                         (intended for daily cron runs that go to the team).
#
# Adding or removing an address: edit the relevant list. PM-editable.
# Emails are sent CC so every recipient sees who else got the report.
#
# Engineer-managed plumbing (SMTP host, port, credentials) lives in
# `config.yaml` under the `email:` key. SMTP credentials are loaded from
# environment variables — see `.env.example`.

# Default — used for `./tune schedule` and `./tune schedule --dry-run` (testing).
