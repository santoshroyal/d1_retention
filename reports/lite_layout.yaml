# Layout for the LITE retention report.
#
# PM-editable. Each section becomes one `## <name>` heading inside every
# retention block in the email. The orchestrator emits this layout once
# per retention level (D1, D7, D30 by default), substituting the four
# placeholder tokens in the Retention section per block:
#
#   __primary_metric__    →  d1_corrected | d7_corrected | d30_corrected
#   __primary_display__   →  "D1 Retention" | "D7 Retention" | "D30 Retention"
#   __users_metric__      →  d1_users | d7_users | d30_users
#   __users_display__     →  "D1 users" | "D7 users" | "D30 users"
#
# To change the report layout, edit this file (add / remove / reorder
# metrics or sections) and re-run `./tune --report lite`. No engineer
# involvement needed as long as the column names you reference exist in
# `data/sheets/app_health_daily.csv` — check `data/dict/app_health_daily.md`
# for the authoritative column list.
#
# The non-retention sections (Engagement, Frequency, Grow Net Installs)
# are identical across all three retention blocks. The Retention section
# uses the placeholders above so the same file drives all three blocks.

sections:
  - name: Engagement
    metrics:
      - column: avg_engagement_time_per_user
        display_name: Average session time
        kind: primary

  - name: Frequency
    metrics:
      - column: dau
        display_name: DAU
        kind: primary
      - column: pct_dau_via_notifications
        display_name: Share of DAU via notifications
        kind: bullet
        bullet_sort: 1

  - name: Grow Net Installs
    metrics:
      - column: installs
        display_name: Installs
        kind: primary
      - column: acquisition_source
        display_name: Acquisition mix
        kind: bullet
        bullet_sort: 1

  - name: Retention
    metrics:
      - column: __primary_metric__
        display_name: __primary_display__
        kind: primary
      - column: d0_uninstalls
        display_name: D0 uninstalls
        kind: bullet
        bullet_sort: 1
      - column: __users_metric__
        display_name: __users_display__
        kind: bullet
        bullet_sort: 2
      - column: pct_d0_login
        display_name: D0 login rate
        kind: bullet
        bullet_sort: 3
      - column: pct_d0_notification_opt_in
        display_name: D0 notification opt-in
        kind: bullet
        bullet_sort: 4
